<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroRuta 2.0 - Transporte Turístico</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">AeroRuta</a>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="login.html" id="link-login">Iniciar Sesión</a></li>
            <li><a href="registro.html" id="link-registro">Registrarse</a></li>
            <li><a href="#" id="link-cuenta" style="display:none">Mi Cuenta</a></li>
            <li><a href="#" id="link-admin" style="display:none">Admin</a></li>
            <li><a href="#" id="btn-logout" style="display:none" onclick="logout()">Cerrar Sesión</a></li>
        </ul>
    </nav>

    <div class="hero">
        <h1>Viaja a tu destino soñado</h1>
        <p>Reserva tu servicio de transporte turístico de forma fácil y segura</p>
    </div>

    <div class="container">
        <div class="card search-box animate-fade-in">
            <h2 style="margin-bottom:1.5rem;text-align:center">Buscar Servicios</h2>
            <div class="search-grid">
                <div class="form-group">
                    <label class="form-label">Origen</label>
                    <select id="origen" class="form-control">
                        <option value="">Seleccione origen</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Destino</label>
                    <select id="destino" class="form-control">
                        <option value="">Seleccione destino</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Fecha</label>
                    <input type="date" id="fecha" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Pasajeros</label>
                    <input type="number" id="pasajeros" class="form-control" min="1" max="10" value="1">
                </div>
            </div>
            <button class="btn btn-primary" style="width:100%" onclick="buscarServicios()">
                🔍 Buscar Servicios
            </button>
        </div>

        <div id="resultados" style="margin-top:2rem"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
