<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AeroRuta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card animate-fade-in">
            <h2>✈️ AeroRuta</h2>
            <p>Crea tu cuenta gratis</p>
            <div id="alertas"></div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Apellido</label>
                    <input type="text" id="apellido" class="form-control">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Documento</label>
                <input type="text" id="documento" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Correo</label>
                <input type="email" id="correo" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Teléfono</label>
                <input type="tel" id="telefono" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control">
            </div>
            <button class="btn btn-primary" style="width:100%;margin-bottom:1rem" onclick="registro()">
                Registrarse
            </button>
            <p style="text-align:center">
                ¿Ya tienes cuenta? <a href="login.html" style="color:var(--primary);font-weight:600">Inicia sesión</a>
            </p>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
