<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AeroRuta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card animate-fade-in">
            <h2>✈️ AeroRuta</h2>
            <p>Inicia sesión en tu cuenta</p>
            <div id="alertas"></div>
            <div class="form-group">
                <label class="form-label">Correo electrónico</label>
                <input type="email" id="correo" class="form-control" placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" style="width:100%;margin-bottom:1rem" onclick="login()">
                Iniciar Sesión
            </button>
            <p style="text-align:center">
                ¿No tienes cuenta? <a href="registro.html" style="color:var(--primary);font-weight:600">Regístrate</a>
            </p>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
